<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 문자 인코딩을 UTF-8로 지정 -->
  <meta charset="UTF-8">
  <!-- 휴대폰 화면 폭에 맞춰 보이도록 설정 (이게 없으면 글씨가 아주 작게 보임) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 보안 정책(CSP): 이 앱 자신의 파일만 불러오고, 외부 주소로는 아무것도 보내거나 받지 못하게 막음.
       require-trusted-types-for: 글자를 HTML로 끼워 넣는 위험한 방식(innerHTML 등)을 브라우저가 아예 차단 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types swPolicy">
  <!-- 다른 사이트로 이동할 때 이 앱 주소를 알려주지 않음 -->
  <meta name="referrer" content="no-referrer">
  <title>PC 유지보수 기록</title>
  <!-- 홈 화면에 추가(앱 설치)용 설정 파일과 아이콘, 상단바 색 -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#1e6fd9">
  <!-- 디자인(모양) 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 맨 위 제목 + 탭 메뉴 ===== -->
  <header class="top-bar">
    <h1>🛠 PC 유지보수 기록</h1>
    <!-- 탭 버튼: data-tab 값과 같은 id를 가진 화면을 보여줌 -->
    <nav class="tabs">
      <button type="button" class="tab active" data-tab="inputPage">✏️ 입력</button>
      <button type="button" class="tab" data-tab="listPage">📋 목록</button>
      <button type="button" class="tab" data-tab="statsPage">📊 통계</button>
    </nav>
  </header>

  <main>
    <!-- =================================================
         화면 1: 입력
         ================================================= -->
    <section id="inputPage" class="page card">
      <h2>새 기록 작성</h2>

      <!-- form: 입력칸들을 하나로 묶는 상자 -->
      <form id="recordForm">

        <!-- 날짜 -->
        <label for="date">날짜</label>
        <input type="date" id="date" required>

        <!-- 부서: 목록은 script.js 맨 위 DEPT_GROUPS 에서 자동으로 채움 -->
        <label for="dept">부서</label>
        <select id="dept" required></select>

        <!-- 장소: 부서를 고르면 나타남 (선택사항, 목록은 script.js 맨 위 PLACES) -->
        <div id="placeBox" class="hidden">
          <label for="place">장소 <small>(선택)</small></label>
          <select id="place"></select>
          <input type="text" id="placeEtc" maxlength="50" class="etc-input hidden" placeholder="장소를 직접 입력하세요 (예: 웰컴센터)">
        </div>

        <!-- 사용자 이름 -->
        <label for="userName">이름 또는 내선번호 <small>(선택)</small></label>
        <input type="text" id="userName" maxlength="50" autocomplete="off" placeholder="예: 홍길동 또는 2257">

        <!-- 대상: 고르면 아래에 그 대상의 증상 버튼이 나타남 -->
        <label>대상</label>
        <div id="deviceGroup" class="device-group">
          <label class="device-option">
            <input type="radio" name="device" value="PC" required>
            <span>PC</span>
          </label>
          <label class="device-option">
            <input type="radio" name="device" value="모니터">
            <span>모니터</span>
          </label>
          <label class="device-option">
            <input type="radio" name="device" value="기타">
            <span>기타</span>
          </label>
        </div>

        <!-- 증상: 버튼은 script.js가 대상에 맞게 채움 -->
        <div id="symptomBox" class="hidden">
          <label>증상</label>
          <div id="symptomBtns" class="chip-group"></div>
          <input type="text" id="symptomEtc" maxlength="100" class="etc-input hidden" placeholder="증상을 직접 입력하세요">
        </div>

        <!-- 조치사항: 증상을 고르면 나타남 -->
        <div id="actionBox" class="hidden">
          <!-- 구분: 증상을 고르면 자동 선택됨 (필요하면 직접 바꿈) -->
          <label>구분</label>
          <div class="device-group kind-group">
            <label class="device-option">
              <input type="radio" name="kind" value="H/W" required>
              <span>H/W</span>
            </label>
            <label class="device-option">
              <input type="radio" name="kind" value="S/W">
              <span>S/W</span>
            </label>
          </div>

          <label>조치사항</label>
          <div id="actionBtns" class="chip-group"></div>
          <input type="text" id="actionEtc" maxlength="100" class="etc-input hidden" placeholder="조치사항을 직접 입력하세요">
        </div>

        <!-- 메모 (자세히 적고 싶을 때만, 비워도 됨) -->
        <label for="memo">메모 <small>(선택)</small></label>
        <textarea id="memo" rows="2" maxlength="500" placeholder="추가로 남길 내용"></textarea>

        <!-- 사용 부품 (없으면 비워도 됨) -->
        <label for="parts">사용 부품 <small>(없으면 비워두세요)</small></label>
        <input type="text" id="parts" maxlength="100" placeholder="예: 파워서플라이 500W 1개">

        <!-- 저장 버튼 -->
        <button type="submit" class="btn-save">💾 저장</button>
      </form>
    </section>

    <!-- =================================================
         화면 2: 목록 (월별 / 일별)
         ================================================= -->
    <section id="listPage" class="page card hidden">
      <h2>기록 목록</h2>

      <!-- 보기 방식 선택 -->
      <div class="toggle">
        <button type="button" class="toggle-btn active" data-mode="month">월별</button>
        <button type="button" class="toggle-btn" data-mode="day">일별</button>
      </div>

      <!-- 월별 보기일 때 보이는 월 선택칸 -->
      <div id="monthPicker">
        <label for="listMonth">월 선택</label>
        <input type="month" id="listMonth">
      </div>

      <!-- 일별 보기일 때 보이는 날짜 선택칸 -->
      <div id="dayPicker" class="hidden">
        <label for="listDay">날짜 선택</label>
        <input type="date" id="listDay">
      </div>

      <!-- 선택한 기간의 총 건수 -->
      <p id="listSummary" class="summary"></p>

      <!-- 엑셀(xlsx) 내보내기 버튼 -->
      <div class="export-row">
        <button type="button" id="exportBtn" class="btn-export">📥 이 목록 엑셀로</button>
        <button type="button" id="exportAllBtn" class="btn-export btn-export-sub">전체 기록 엑셀로</button>
      </div>

      <!-- 주차를 골라 CSV(엑셀에서 열리는 글자 파일)로 내보내기 -->
      <label for="csvWeek">주차별 CSV 내보내기</label>
      <div class="csv-row">
        <select id="csvWeek"></select>
        <button type="button" id="csvBtn" class="btn-export">📄 CSV</button>
      </div>

      <!-- 목록이 이 안에 자바스크립트로 채워짐 -->
      <div id="recordList"></div>
    </section>

    <!-- =================================================
         화면 3: 통계 (월별 / 분기별 / 연도별)
         ================================================= -->
    <section id="statsPage" class="page card hidden">
      <h2>통계</h2>

      <!-- 연도와 기간을 드롭다운으로 선택 -->
      <div class="stats-select">
        <div>
          <label for="statsYear">연도</label>
          <select id="statsYear"></select>
        </div>
        <div>
          <label for="statsPeriod">기간</label>
          <select id="statsPeriod"></select>
        </div>
      </div>

      <!-- 선택한 기간을 보고서 양식(월별 표지 + 내역) 엑셀로 내보내기 -->
      <button type="button" id="exportStatsBtn" class="btn-export btn-wide">📥 이 기간 보고서 엑셀로</button>

      <!-- 통계 결과가 이 안에 자바스크립트로 채워짐 -->
      <div id="statsResult"></div>
    </section>
  </main>

  <!-- 엑셀(xlsx) 파일을 만들어 주는 라이브러리(xlsx-js-style 1.2.0 = SheetJS + 테두리·색 서식 기능).
       외부 인터넷(CDN)이 아니라 앱 폴더(lib)에 넣어 두어 변조 위험이 없고 오프라인에서도 작동.
       integrity: 파일 내용이 한 글자라도 바뀌면 실행하지 않음 (라이브러리를 바꾸면 이 값도 새로 계산해야 함) -->
  <script src="lib/xlsx.bundle.js" integrity="sha384-OUW9euuUyxyHcAhTqbhI+Iyb8LMssXt/cpz0yXhs9UWG2/R/uaWdakx/4cfww7Vb"></script>
  <!-- 동작(기능) 파일 연결: body 맨 끝에 두어야 위의 요소들을 찾을 수 있음 -->
  <script src="script.js"></script>
</body>
</html>
